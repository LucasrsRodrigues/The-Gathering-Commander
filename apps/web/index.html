<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Content-Security-Policy (defense in depth against XSS). Only Scryfall (API + image CDN), Google Fonts and
         the login providers' avatar hosts are allowed off-origin; keep in sync with src/catalog/hosts.ts and
         src/account/client.ts.
         Dev server strips it (vite.config.ts) because Vite's HMR needs inline scripts and websockets.
         frame-ancestors is ignored in <meta>: the host must send it as an HTTP header. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https://cards.scryfall.io https://cdn.discordapp.com https://lh3.googleusercontent.com; connect-src 'self' https://api.scryfall.com %VITE_SERVER_URL% %VITE_SERVER_WS%; object-src 'none'; base-uri 'self'; form-action 'none'" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Fan game gratuito e open source de Commander com mesa interativa." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Gathering Hall</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
