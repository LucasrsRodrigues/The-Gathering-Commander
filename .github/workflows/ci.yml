name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # A real Postgres, so the database tests also run against the production driver (not only PGlite).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test # includes the engine fitness functions
      - run: npm run build

  # Deploys only after every check passed on main. The EasyPanel deploy webhook stays in the secret
  # EASYPANEL_DEPLOY_URL of the GitHub environment "devel"; without it this job just skips.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: devel
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_URL }}
    steps:
      - name: Trigger EasyPanel deploy
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "::notice::EASYPANEL_DEPLOY_URL não configurado; deploy pulado."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 -X POST "$DEPLOY_URL" > /dev/null
          echo "Deploy disparado no EasyPanel."
